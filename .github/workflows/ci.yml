name: EIWAMS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  api:
    name: API (.NET 10, tests, publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # Disposable SQL Server for the integration tests. Never point EIWAMS_TEST_CONNECTION at the EIWAMS application database.
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: ${{ format('Eiwams_Ci_{0}_Aa1', github.run_id) }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -b -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s

    env:
      EIWAMS_TEST_CONNECTION: ${{ format('Server=localhost,1433;Initial Catalog=EIWAMS_Test;User ID=sa;Password=Eiwams_Ci_{0}_Aa1;Encrypt=True;TrustServerCertificate=True', github.run_id) }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Verify the API project is tracked as files (not a gitlink)
        shell: bash
        run: |
          set -euo pipefail
          gitlinks=$(git ls-files -s | awk '$1 == "160000" { print $4 }')
          if [ -n "$gitlinks" ] && [ ! -f .gitmodules ]; then
            echo "::error::Gitlink entries without .gitmodules (folder committed as a nested repo): $gitlinks"
            exit 1
          fi
          for f in EIWAMS.API/EIWAMS.API.csproj EIWAMS.API/Program.cs EIWAMS.API/host.json EIWAMS.API.slnx; do
            mode=$(git ls-files -s -- "$f" | awk '{ print $1 }')
            if [ "$mode" != "100644" ] && [ "$mode" != "100755" ]; then
              echo "::error file=$f::$f is not tracked as a regular file (mode '${mode:-missing}')."
              exit 1
            fi
          done
          echo "API project files are tracked."

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EIWAMS.API.slnx

      - name: Build (Release)
        run: dotnet build EIWAMS.API.slnx -c Release --no-restore

      - name: Test (Release)
        run: >-
          dotnet test EIWAMS.API.slnx -c Release --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory "${{ runner.temp }}/test-results"

      - name: Summarize tests (unit vs SQL integration)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $files = Get-ChildItem "${{ runner.temp }}/test-results" -Filter *.trx -Recurse -ErrorAction SilentlyContinue
          if (-not $files) { Write-Host '::error::No test results were produced.'; exit 1 }
          $rows = foreach ($f in $files) {
            [xml]$trx = Get-Content $f.FullName -Raw
            $ns = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
            $defs = @{}
            Select-Xml -Xml $trx -XPath '//t:UnitTest' -Namespace $ns | ForEach-Object { $defs[$_.Node.id] = $_.Node.TestMethod.className }
            Select-Xml -Xml $trx -XPath '//t:UnitTestResult' -Namespace $ns | ForEach-Object {
              $n = $_.Node
              [pscustomobject]@{
                Kind    = if ($defs[$n.testId] -like '*.Integration.*') { 'SQL integration' } else { 'Unit' }
                Outcome = $n.outcome
                Name    = $n.testName
                Message = $n.Output.ErrorInfo.Message
              }
            }
          }
          $md = "### API tests`n`n| Kind | Passed | Failed | Skipped |`n|---|---|---|---|`n"
          foreach ($g in $rows | Group-Object Kind) {
            $p = @($g.Group | Where-Object Outcome -eq 'Passed').Count
            $f = @($g.Group | Where-Object Outcome -eq 'Failed').Count
            $s = @($g.Group | Where-Object { $_.Outcome -in 'NotExecuted', 'Skipped', 'Inconclusive' }).Count
            $md += "| $($g.Name) | $p | $f | $s |`n"
          }
          $failed = @($rows | Where-Object Outcome -eq 'Failed')
          $skipped = @($rows | Where-Object { $_.Outcome -in 'NotExecuted', 'Skipped', 'Inconclusive' })
          if ($failed) { $md += "`n**Failed:**`n" + (($failed | ForEach-Object { "- ``$($_.Name)``" }) -join "`n") + "`n" }
          if ($skipped) { $md += "`n**Skipped:** " + (($skipped | Select-Object -First 1).Message) + "`n" }
          $md | Add-Content $env:GITHUB_STEP_SUMMARY
          $md | Write-Host
          if ($skipped) {
            Write-Host "::warning::$($skipped.Count) test(s) were skipped although the disposable SQL Server container is configured. Check the 'sql' service logs and how EIWAMS.Tests reads EIWAMS_TEST_CONNECTION."
          }

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: eiwams-test-results
          path: ${{ runner.temp }}/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish API
        run: dotnet publish EIWAMS.API/EIWAMS.API.csproj -c Release --no-restore -o "${{ runner.temp }}/api"

      - name: Verify package layout
        shell: bash
        run: |
          set -euo pipefail
          pkg="${{ runner.temp }}/api"
          for f in host.json EIWAMS.API.dll functions.metadata; do
            [ -f "$pkg/$f" ] || { echo "::error::$f is missing from the package root."; exit 1; }
          done
          echo "Package root contains host.json, EIWAMS.API.dll and functions.metadata."

      - name: Upload API package
        uses: actions/upload-artifact@v7
        with:
          name: eiwams-api
          path: ${{ runner.temp }}/api
          include-hidden-files: true
          retention-days: 7

  web:
    name: Web (Angular 22, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: EIWAMS.Web

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: EIWAMS.Web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Test (Vitest via @angular/build:unit-test)
        run: npx ng test --watch=false

      - name: Build (production)
        run: npm run build

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          out=dist/EIWAMS.Web/browser
          [ -f "$out/index.html" ] || { echo "::error::$out/index.html is missing."; exit 1; }
          [ -f "$out/web.config" ] || { echo "::error::$out/web.config (SPA fallback) is missing."; exit 1; }
          echo "Build output verified: $(find "$out" -type f | wc -l) files."

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: eiwams-web
          path: EIWAMS.Web/dist/EIWAMS.Web/browser
          retention-days: 7
